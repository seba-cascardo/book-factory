# bible/audit-config.yaml — configuration for the deterministic audit scripts.
#
# Optional: every field has a default and a project with no such file still gets
# every check. See scripts/README.md and references/claim-index.md.

# ── The incomplete-fix detector ──────────────────────────────────────────
# Short shas of past fix passes. A related pair where ONE side has blame in one of
# these and the other does not is the signature of a fix that landed in 1 of N
# sites. Add a sha after every fix pass (`git log --oneline`).
fix_run_commits: []
  # - 3e6829b

# ── Running-example characters ───────────────────────────────────────────
# Used ONLY to down-rank pure narration when ranking claim passages, and guarded
# so it never trims a sentence that also states a rule (a didactic book teaches
# its rules THROUGH the example).
persona_names: []
  # - Ana

# ── Code classification (MG-6 corpus extraction) ─────────────────────────
# Regex per artifact kind, matched against each fenced block's body. With no
# config, blocks group by their fence language tag.
code_kinds: {}
  # load_script:  ["^\\s*(LOAD|SELECT)\\b", "\\bRESIDENT\\b"]

# ── Thresholds — change only with a measurement in hand ──────────────────
# Why the defaults: docs/rationale/gate.md#similarity.
related_threshold: 0.12   # Jaccard over content terms; deliberately below the
                          # noise p99 — a false positive costs one pair to read,
                          # a false negative loses the defect.
related_top_k: 5          # neighbours per passage; bounds PROPAGATE.
home_cap: 12              # top-N claims kept from a concept's home unit; cross-
                          # linked passages are never trimmed. A trimmed dossier
                          # is a SAMPLE; raise it per concept with `home_cap` in
                          # bible/concept-probes-tuned.yaml.
use_blame: true           # false skips git entirely
