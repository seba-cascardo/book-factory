# bible/rule-probes-tuned.yaml — hand-written narrowings for MG-2 rules
#
# The rule-side twin of bible/concept-probes-tuned.yaml. A rule that reaches more
# instances than one agent run can judge ships `tractable: false` and can only be
# SAMPLED; a sampled subject keeps the gate at PASS-PARTIAL. Narrowing is how it
# closes by work. Why: docs/rationale/gate.md#depth.
#
# NARROWING IS A CLAIM ABOUT SCOPE. Every entry asserts "this rule does not reach
# those instances", and that can be wrong. If a rule really governs 87 code blocks,
# do not shrink it to make a number go down: leave it sampled and accept it under
# the `manuscript_gate.coverage` waiver.
#
# The worklist: the gate writes every intractable rule, ranked, with a stub, to
# reviews/manuscript-gate-<run>/round-N/rule-probes-proposed.yaml. Ids are
# content-derived (<unit>-<term>-<hash6>) and appear in round-N/rules/_index.md;
# an unknown id is reported loudly. A narrowed rule stays in the denominator
# whatever its instance count. Every list field also accepts a single string.

rules:
  - id: ch-07-concatenate-4f2a91
    key_terms: [CONCATENATE]     # replace the derived terms outright — the usual
                                 # case: a sentence naming five identifiers reaches
                                 # the union of all five
    note: the rule is about CONCATENATE on an optimized load; Staging and QVD are
      the running example's vocabulary

  - id: ch-11-peek-9c01d3
    require_terms: [Max]         # an instance must ALSO contain these (a combination)
    note: the rule only binds when Peek derives a watermark

  - id: ch-03-load-77e0b2
    scope_units: [ch-03, ch-04]  # only instances in these units
    scope_heading: "Incremental" # only under a heading path containing this
    exclude_pattern: '^\s*--\s*counter-example'   # instances matching this are out
    note: the prohibition is stated inside the incremental-load walkthrough

  - id: ch-18-aggr-0d5e6f
    split:                       # one broad rule is really several; each sub-rule
      - suffix: set-inside       # is its own subject `<id>--<suffix>` and must come
        key_terms: [Aggr]        # in under the ceiling on its own
        require_terms: [Region]
        note: the set modifier inside the outer aggregation's own parens
      - suffix: set-outside
        key_terms: [Aggr]
        require_terms: [Sum]
        note: the set modifier outside, where both aggregations see it

