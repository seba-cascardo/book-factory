# bible/claim-index.yaml — concept × location matrix with propagation.
#
# Answers the one question nothing else in the pipeline can: "I am about to
# edit this line — what ELSE says the same thing?" Without it a fix lands in
# one of N sites and the book contradicts itself. Reference:
# references/claim-index.md. Why: docs/rationale/gate.md#claim-index
#
# GENERATED, not hand-written:
#   python scripts/build_concept_dossier.py --emit-index
#   python scripts/validate_claim_index.py [--fix]
#
# `sites` is regenerated wholesale. Four fields survive regeneration because
# they carry human decisions: each site's `role`, and per concept
# `verified_against`, `do_not_touch` and `note`. Everything else is derived.
#
# Why it does not go stale: it is an index of POINTERS (it cannot disagree
# with the book — the fingerprint is in the text or the validator says so);
# it has no state a human must remember to tick; and something reads it
# automatically (the manuscript gate every round, the build preflight, the
# fix-then-verify step).
#
# ── The fingerprint, and why locations are not the key ────────────────────
#
# `fingerprint` = sha1 of the passage's fingerprint form (bookkit/textmetrics.py):
# prose folded (markdown marks, punctuation and case out), code spans kept
# VERBATIM — operators, signs and case included, so `Peek(v,-1)` → `Peek(v,1)`
# is an edit. `location` is a convenience the validator repairs:
#
#   passage MOVED    → fingerprint still present, on another line
#                      → auto-repaired (--fix), no human involved
#   passage EDITED   → fingerprint gone
#                      → CHANGED; every sibling in `related` is flagged and the
#                        validator emits PROPAGATE with the list
#
# A line-number key would make every insertion look like an edit.
#
# ── Field reference ───────────────────────────────────────────────────────
#
# Per concept:
#   name              display name; from the knowledge graph when there is one
#   home              unit where the concept is introduced
#   verified_against  "<source path>:<line>" once the concept has been closed
#                     against an authoritative source — a first-class POSITIVE
#                     verdict: "verified correct, do not reopen"
#   do_not_touch      true when a finding against this concept is refuted by
#                     default. Always write `note` with the counter-evidence.
#   note              why it is verified / why it must not be touched
#   sites             every passage that makes a claim about the concept
#
# Per site:
#   location          "<path>:<line>" — repaired automatically when it moves
#   role              CANON     the definitive statement; exactly one per concept
#                     repeats   restates CANON elsewhere
#                     derives   draws a consequence from CANON
#                     qualifies adds a condition or exception
#                     summary   recap bullet; the second side of a
#                               contradiction, never the first
#                     example   inside an exercise or worked example
#                     crossref  a pointer, not a claim
#   fingerprint       sha1(fingerprint form)[:12] — the durable key
#   claim             first 110 chars, for reading the file; the text in final/
#                     is the truth
#   blame             "<short sha> <YYYY-MM-DD>" or "—"
#   related           up to 5 sites carrying the same sub-claim (Jaccard over
#                     content terms >= 0.12): PROPAGATE names the 3 or 4
#                     passages that matter, not every site of the concept

schema_version: "1.0"

concepts:
  # --- Example entry (the generator overwrites this file wholesale) ---
  example_concept:
    name: "[display name]"
    home: unit-05
    verified_against: null        # e.g. "bible/sources/spec.md:12177"
    do_not_touch: false
    note: null
    sites:
      - location: final/unit-05.md:186
        role: CANON
        fingerprint: 17524a9349e1
        claim: "[first 110 characters of the passage — for reading, not for truth]"
        blame: "a9c1a44 2026-07-10"
        related:
          - final/unit-05.md:454
          - final/unit-05.md:196

      - location: final/unit-05.md:454
        role: repeats
        fingerprint: 8f3b21c07de4
        claim: "[the passage that restates it]"
        blame: "2b3995e 2026-07-12"
        related:
          - final/unit-05.md:186
