# project-status.yaml — machine-readable state of the project
#
# The skill reads it on every invocation to resume where it left off; every step
# that advances state updates it. Phase detection keys on `schema_version`: if it
# is not "3.4", the skill says the project predates the current skill and offers
# to re-scaffold (no automatic migration).
#
# Not here: the agent runs log is `runs.tsv` at the project root (written only by
# `scripts/pipeline_step.py done`), and the manuscript gate's state is its own
# `state.json` (written only by `scripts/manuscript_gate.py`). This file points at
# the latter and is never rewritten by a script.

schema_version: "3.4"

phase: "setup"
# init → setup → knowledge-graph → outlining → drafting → assembly →
# manuscript-gate → build → complete
#   manuscript-gate — Phase 4.5; set AUTOMATICALLY when the last unit is archived.
#                     The orchestrator never reports a book done from `assembly`.
#   blocked-on-manuscript-gate — max_rounds reached without converging, or an
#                     unresolved critical; an escalation packet exists and the
#                     human decides. A legitimate resting state, never `complete`.

current_unit: null               # e.g. "unit-03" — the unit in flight, or null

outline:
  approved: false                # set true WHEN the human approves outline/units.yaml,
  approved_on: null              # before `pipeline_step.py ready` (which reads it)

# ── Definition of done (SKILL.md § Definition of done) ────────────────────
# `phase: complete` requires ALL of:
#   1. every unit `archived`
#   2. the manuscript gate CONVERGED (manuscript_gate.py exits 0: PASS, or
#      PASS-PARTIAL with a valid coverage waiver, and two quiet rounds)
#   3. no unresolved CHANGED in bible/claim-index.yaml
#   4. literary: `check_story.py --manuscript` exits 0 (arcs, ending, ledger)
#   5. every build target verified (references/build-export.md)
#   6. a done report listing open waivers and unresolved minors, accepted by the human

units: {}
  # unit-01:
  #   status: drafted              # drafted | reviewed | approved | archived | on_hold
  #   digest_written: false        # sequential profiles only
  #   scorecard_last_verdict: null # PASS | REVISE | REWORK | ESCALATE | null
  #   archived_on: null            # ISO-8601 (references/archiving.md)
  #   # on_hold: parked after an escalation (cap hit, plateau, Critic ESCALATE, a
  #   # second contract violation); a held unit blocks the gate.

knowledge_graph:
  last_verified: null             # ISO-8601; bumped at KG sign-off and on every revision

# ── Waivers — nothing is switched off in silence ─────────────────────────
# A waived check is a decision; a check that is simply off is an accident, and
# the gate reports it as a `major` finding. A waiver counts ONLY with all three:
# who (`waived_by`), why (`reason`), what is owed (`debt`, quoted verbatim in
# the done report) — real text, not a placeholder (x, N/A, TBD…), and `reason`
# and `debt` 20+ characters each. MG-6 waivers (a surface, or
# `manuscript_gate.MG-6`) also name an entry that exists in the verification
# plan. Literary R1–R4 (MG-S, story blocks) and literary MG-4 / MG-C have no
# waiver: an entry for them is ignored, and a coverage waiver never covers them.
waivers: []
  # - check: validation_surface.python_exec      # MG-6: counts only WITH a plan entry
  #   waived_by: human
  #   reason: "no sandbox for this product in this environment"
  #   date: "2026-08-01"
  #   plan: reviews/verification-plan/PLAN.md#V-03   # the entry (### V-03) must exist
  #   debt: "56 checks, 0 run"
  #
  # - check: manuscript_gate.MG-4                 # a gate check switched off in meta.yaml
  #   waived_by: human
  #   reason: "the author read the manuscript end to end on 2026-08-02"
  #   debt: "no MG-4 report; the author's notes are in human-notes.md"
  #
  # - check: manuscript_gate.coverage             # lets PASS-PARTIAL converge
  #   waived_by: human
  #   reason: "MG-2 held at 30 rules/round by budget; 14 rules genuinely govern every example"
  #   date: "2026-08-03"
  #   debt: "212 subjects never opened, 14 sampled, as of round 4"
  #   signature: "cov:3f2a9b1c0d4e"   # PASTE what the gate prints; a stale one does not count

manuscript_gate:
  state: null   # reviews/manuscript-gate-<run>/state.json — set by the orchestrator
                # when Phase 4.5 starts. Verdict, rounds and convergence live THERE.

retries:
  # Per-unit loopback counter; cap = pipeline.retry_cap. ONE shared budget per unit
  # across Technical-Reviewer→Writer, Critic→any, confirmed adversarial REVISEs and
  # human rejections. On a cap hit: escalation packet
  # (references/loopback-handoff.md); once the human picks a path, the counter resets.
  by_unit: {}                     # e.g. { "unit-03": 2 }
  cap_hits: []                    # [unit-NN, ISO-8601 timestamp], one per hit
