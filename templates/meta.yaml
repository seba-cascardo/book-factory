# bible/meta.yaml — one project's identity, contract, and pipeline config
#
# Read by every agent on every turn: keep it short and current. ONE template
# for all five profiles — fill the blocks your profile uses, delete the rest.
# Phase detection keys on `schema_version` (bottom). Not "3.4" → the project
# predates this skill; there is no automatic migration.

# ─────────────────────────────────────────────────────────────────────────
# project — what this is; the profile drives every downstream decision
# ─────────────────────────────────────────────────────────────────────────
project:
  profile: "book-technical"
  # book-technical | book-literary | corporate-guide | product-docs |
  # scientific-paper (read stripped and lowercased; missing or unknown → the
  # scripts exit 2). Every agent loads references/profiles/<profile>.md;
  # on register or structure the PROFILE WINS over this file.

  subtype: "tutorial"
  # book-technical ONLY (delete elsewhere):
  # tutorial | reference | cookbook | textbook | opinion

  title: "[working title]"
  subtitle: "[optional — the promise in one line; null if none]"
  language: "en"                 # ISO code of the prose language
  language_variant: "en-US"      # en-US | en-GB | es-AR | es-ES | ...
  # CANONICAL home of the variant. Scripts resolve project.language_variant →
  # conventions.language_variant → project.language → en, and load the word
  # lists of scripts/lexicons/<lang>.yaml (+ bible/lexicon.yaml) from it.

# ─────────────────────────────────────────────────────────────────────────
# audience — the most load-bearing block; every agent uses it
# ─────────────────────────────────────────────────────────────────────────
audience:
  primary: "[one-sentence reader persona: who they are, what they already
             know, what they are trying to do]"
  prerequisites: "[what the reader MUST already know before unit 1]"
  not_for: "[who this is NOT for — lets the Writer resist going wide]"
  experience_level: "beginner"   # beginner | intermediate | advanced
  known_frustrations: "[what this reader is tired of in existing material on
                        the topic — the Writer writes against these, the
                        Reader-POV persona feels them]"

# ─────────────────────────────────────────────────────────────────────────
# scope — headline only; bible/scope.md carries the full version
# ─────────────────────────────────────────────────────────────────────────
scope:
  covers: "[one sentence: what this document delivers]"
  does_not_cover: "[what is explicitly out of scope — the Critic's scope-2
                    check reads bible/scope.md, this is the summary]"
  depth: "tutorial"              # tutorial | reference | overview | mixed

# ─────────────────────────────────────────────────────────────────────────
# organization — corporate-guide ONLY (delete for every other profile)
# ─────────────────────────────────────────────────────────────────────────
# organization:
#   name: "[company or team name]"
#   audience_role: "[the internal role that reads this — e.g. 'new hires on
#                    the data team']"
#   internal_context: "[systems, jargon, or process the guide assumes the
#                       reader lives inside]"
#   confidentiality: "internal"  # public | internal | confidential

# ─────────────────────────────────────────────────────────────────────────
# citation_style — scientific-paper ONLY (delete for every other profile)
# ─────────────────────────────────────────────────────────────────────────
# citation_style: "apa"          # apa | ieee | vancouver | author-year

# ─────────────────────────────────────────────────────────────────────────
# literary — book-literary ONLY (delete for every other profile)
# See references/profiles/book-literary.md. Keys are parsed by
# scripts/check_story.py and pipeline_step.py — keep them exactly.
# ─────────────────────────────────────────────────────────────────────────
literary:
  seeds:                    # human-provided; the pipeline never invents these
    title: ""
    premise: ""
    only_in_this_book: []   # concrete details only this book has
  min_seeds: 5
  human_calibration_passages: 1
  fact_check: realistic     # realistic | invented
  reader_profile: holistic  # holistic | surface — with audience.primary, the
                            # Reader-POV persona (profile § Reader-POV persona)
  key_scene_versions: 2
  tic_pass_every: 3
  # Optional — defaults shown; scripts read them when present:
  # humanizer_budget: 0.03  # max Humanizer touched ratio (check_role_diff; voice-6)
  # tics:
  #   gesture_per_1000: 0.6 # gesture quota per 1000 words (lint_fiction; craft-6)
  #   gesture_min: 3        # quota floor per unit

# ─────────────────────────────────────────────────────────────────────────
# target_version / pinned_versions / validation_surface — nonfiction only
# ─────────────────────────────────────────────────────────────────────────
target_version:
  # The subject version the document teaches. With the drift rules in
  # bible/sources/sources.md, an older source yields "version drift, not
  # error" advisories, not REVISE loops. null when not version-pinned.
  subject: null
  version: null
  released: null                 # YYYY-MM

pinned_versions:
  # Every tool/library version the document commits to (tech_a-3), e.g.
  #   python: "3.12"
  {}

validation_surface:
  # Machine-checkable content and how to check it —
  # references/validation-surface.md (+ optional packs in references/surfaces/).
  identifier_allowlist: []
  # Names check_identifiers.py must accept although no source defines them
  # (the project's own helpers, fixture names). Real APIs belong in the
  # sources, not here.
  #
  # Entry shape:
  #   { surface: <id>, applies_to: [<globs>], runner: <command|tool>,
  #     executable: true|false, evidence: <path to the runner's saved output>,
  #     pins: {<version keys>} }
  # MG-6 accepts an executable surface only when `evidence` names an existing,
  # non-empty file (or a waiver with a plan entry covers it): a runner string is
  # never evidence that it ran.
  # Catalogue: python_exec, js_node_exec, bash_exec, sql_dialect_check,
  # yaml_schema_validate, json_schema_validate, linter, doc_cross_ref,
  # proof_recheck, citation_check, stats_check, empty.
  # scientific-paper usually declares citation_check + stats_check.
  surfaces: []

# ─────────────────────────────────────────────────────────────────────────
# tone — register and the calibration the prose agents check against
# ─────────────────────────────────────────────────────────────────────────
tone:
  register: "you"                # you | we | impersonal
  # you = direct address; we = inclusive; impersonal = reference/academic.
  # scientific-paper is typically impersonal; corporate-guide often you/we.
  formality: "neutral"           # casual | neutral | formal
  humor_allowed: true            # profiles may narrow this; corporate-guide
                                 # and scientific-paper usually false
  profanity_allowed: false
  calibration_passages: "see bible/style-guide.md § Calibration"
  # Pointer only; the passages live in the style guide and feed
  # bible/voice-profile.md.

# ─────────────────────────────────────────────────────────────────────────
# structure — how the document is divided
# ─────────────────────────────────────────────────────────────────────────
structure:
  type: "linear"                 # informational; the profile's Sequence rules
  unit_length_target_words: 3500
  unit_length_min: 2500
  unit_length_max: 5000
  exercises: "none"              # none | per_section | per_unit
  # product-docs, scientific-paper, book-literary: none.

# ─────────────────────────────────────────────────────────────────────────
# conventions — the formatting the document commits to
# ─────────────────────────────────────────────────────────────────────────
conventions:
  code_language: "python"        # primary code language, or null for prose-only
  style_guide: "PEP 8 + black"   # code style, or the prose style manual
  heading_case: "sentence"       # sentence | title
  callout_types: ["Note", "Warning", "Tip"]
  # Closed list (corporate-guide: Note / Template / Checklist).
  dash_style: "em-dash, no spaces"
  # Narration dashes only. Spanish dialogue uses the raya; no rule counts
  # dialogue rayas as em-dashes.
  number_rule: "words < 10, digits >= 10 (except in code)"
  date_format: "YYYY-MM-DD"

# ─────────────────────────────────────────────────────────────────────────
# pipeline — how Phase 3 runs for this project
# ─────────────────────────────────────────────────────────────────────────
pipeline:
  mode: "fast"                   # fast | full — nonfiction only; references/pipeline.md
  # full adds Reader-POV after the Humanizer. book-literary ignores this key.

  retry_cap: 2                   # fast: 2 · full: 3 · literary: 3
  # One budget for Reviewer→Writer, Critic→any, confirmed adversarial findings
  # and human rejections. On cap — or plateau — references/loopback-handoff.md.

  adversarial_verify:            # references/adversarial-verify.md
    mode: "gate_critical"        # off | gate_critical | every_unit | every_N
    n: 3                         # every_N only
    cross_model: false           # refutation passes and the gate's MG-4 read on
                                 # a second model when a tool exists; otherwise
                                 # the packet says "cross-model unavailable"
  # gate_critical runs on units marked `gate_critical: true` in the outline;
  # with none marked it costs nothing. Mark few.

  humanizer_budget: null         # nonfiction: max Humanizer touched ratio (0-1)
  # null = report only. A ratio makes voice-8 live (over budget → Writer).
  # Literary always runs a budget: literary.humanizer_budget, default 0.03 (voice-6).

  reader_testing: false          # corporate-guide / product-docs only: predicted
                                 # questions answered from the text by an
                                 # isolated subagent (see the profile)

  # Optional, off when absent:
  # reviewer_can_run_code: false # Technical Reviewer runs runnable examples in
  #                              # a sandbox with the pinned versions
  # pre_draft_expansion: false   # nonfiction Writer writes draft-plan.md first

  manuscript_gate:
    # Phase 4.5 — the book-level gate (references/manuscript-gate.md; literary
    # checks: references/manuscript-gate-literary.md). Fires automatically when
    # the last unit is archived.
    max_rounds: 5                # then escalate; never relax the criterion
    rounds_without_new_to_close: 2   # consecutive swept rounds with no new blocking finding
                                     # (minimum 2: lower values are clamped, with a note)
    concept_min_units: 2         # MG-1: concepts spanning at least this many units
    top_concepts: 40             # PER-ROUND quotas, not ceilings: later rounds audit
    top_rules: 30                # the next slice. Cost: ~170-230k tokens per lens run
                                 # x passes_per_subject EACH (docs/rationale/gate.md#cost)
    passes_per_subject: 2        # MG-1/MG-2: a subject with fewer passes is partly read
    checks:                      # false ONLY with a complete `manuscript_gate.<check>`
                                 # waiver (who, why, debt) in project-status.yaml;
                                 # otherwise it is a major finding
      MG-1: true                 # concept audit                  (nonfiction)
      MG-2: true                 # rule vs its own instances      (nonfiction)
      MG-3: true                 # exercises; skipped when no unit declares any
      MG-4: true                 # whole-book read — "is it enough?"
      MG-5: true                 # render lint
      MG-6: true                 # executable code: runner evidence file, or a waiver WITH a plan entry
      MG-7: true                 # a fixed defect came back
      MG-S: true                 # book-literary: story closure — never false, never waived (R1–R4)
      MG-T: true                 # book-literary: book-level tics (lint_fiction.py)
      MG-C: true                 # book-literary: continuity & developmental audit — never
                                 # false, never waived (MG-4 too in book-literary: R2)
    # book-literary: MG-1, MG-2, MG-3, MG-6 are n/a by profile (no waiver needed).

  reader_panel: 1                # Reader-POV personas per run (the profile names them)

  chapter_digest:
    enabled: true                # sequential profiles; product-docs has none
    target_words: 400
  archive_drafts:
    enabled: true                # references/archiving.md
  coverage_audit:
    enabled: true                # Phase 4 orphan-terms scan (KG profiles)
    # severity_threshold: {occurrences: 5, units: 3}   # orphan → significant at either
  polish_pass:
    enabled: true                # Phase 4, nonfiction fast mode; disabling needs
                                 # a waiver. Literary uses literary.tic_pass_every.

# ─────────────────────────────────────────────────────────────────────────
# models — roles map to TIERS, never to model IDs
# ─────────────────────────────────────────────────────────────────────────
models:
  # A tier resolves to `inherit` (session model, no override) or a model ID.
  # Put an ID on a TIER only for cost control; never under a role or in any
  # skill file.
  tiers:
    creative: inherit
    audit: inherit
  roles:
    writer: creative
    technical_reviewer: audit
    editor: audit
    humanizer: audit             # book-literary: creative — voice is the product
    reader_pov: audit
    critic: creative
    proofreader: audit
    continuity_guardian: audit
    adversarial: audit           # skeptics and refuters
    default: audit               # any role not listed

# ─────────────────────────────────────────────────────────────────────────
schema_version: "3.4"            # phase detection keys on this; do not edit
