# outline/units.yaml — per-unit entry template (one shape per profile)
#
# A LIST of entries in the order the READER meets them. Use the shape for the
# project's profile and delete the rest; verification rules per profile are in
# references/outlining.md. `unit` is the file id as a string ("unit-01", not
# 01, which YAML reads as the integer 1). Talk to the human in the profile's
# word (chapter | article | section).
#
#   book-technical → § TECHNICAL    book-literary → § LITERARY
#   corporate-guide, product-docs → § LIGHT    scientific-paper → § PAPER

units:

  # ==========================================================================
  # § TECHNICAL — book-technical
  # ==========================================================================
  - unit: unit-01
    title: ""
    part: ""
    gate_critical: false        # § gate_critical below
    purpose: ""                 # ONE sentence: what the reader can DO after it
    concepts_introduced: []     # KG ids this unit is the authoritative intro for
    concepts_used:              # KG ids used here, with where each was introduced
      - id: ""
        introduced_in: unit-NN  # must be earlier
    structure:
      - heading: ""
        covers: ""
    examples:
      - shows: ""
        runnable: true
    exercises:
      - prompt: ""
        solution_sketch: ""
        concepts: []
    forward_references:         # DELIBERATE deferrals (declared = fine)
      - concept: ""
        deferred_to: unit-NN
        why: ""
    risks: []                   # where readers get stuck; misconceptions
    closing: ""                 # per the closing policy
    target_words: 0

  # ==========================================================================
  # § LITERARY — book-literary
  # Beats are scene cards: the Writer's contract and the Critic's checklist.
  # characters_present holds SLUGS; a name without a sheet triggers R4.
  # ==========================================================================
  - unit: unit-01
    title: ""
    gate_critical: false
    key_scene: false            # true → the Writer drafts literary.key_scene_versions
                                # divergent versions of the card marked key: true;
                                # the human picks
    pov: ""                     # slug
    timeline: ""                # story date + weekday + time, e.g. "Sun 2019-03-17, evening"
    location: ""                # a place; its capitalized words are places, never people
    characters_present: []      # slugs
    arc_moves: []               # [{character: slug, turning_point: 1}] — 1-based index
                                # into the sheet's arc.turning_points
    beats:
      - id: s1
        type: scene             # scene | exposition-within-scene
        key: false              # the key scene of a key_scene unit
        words: 0                # planned
        summary: ""
        link: ""                # "therefore …" / "but …": how the previous scene causes this one
        want: ""                # POV want (required for scenes >= 300 planned words)
        opposition: ""
        pivot: ""
        value: {name: "", from: "+", to: "-"}
        crisis: ""              # the dilemma: a choice between two costs
        attempts: [{action: "", fails_because: ""}]   # optional; tension and key scenes
        information: ""         # exposition-within-scene: the fact delivered
        actioned_by: ""         # who wants it, withholds it, or pays to say it
        pause: ""               # optional: the turn that ends a deliberate slow beat
        ledger: {plants: [], pays: []}                # story-ledger ids
    emotional_arc: {start: "", shift: "", end: ""}    # the POV's inner movement
    plot_threads: {advances: [], introduces: [], resolves: []}
    reveals: {to_reader: [], to_characters: []}
    secondary_lines:            # a line of their own for recurring secondaries (craft-3)
      - character: ""           # slug
        note: ""
    target_words: 0
    notes: ""                   # echo-check decisions, dormant subplots, open questions

  # ==========================================================================
  # § LIGHT — corporate-guide
  # Openings self-contained; cross-refs by topic, never by number.
  # ==========================================================================
  - unit: unit-01
    title: ""
    gate_critical: false
    purpose: ""                 # what the employee can do or decide after reading
    audience_moment: ""         # WHEN someone reaches for it: a meeting, an incident, an approval
    key_points: []
    practice:                   # OPTIONAL, only if enabled in meta; internal cases
      - prompt: ""
    templates_and_checklists: []
    cross_refs: []              # topics ("escalation paths"), never "Section 3"
    target_words: 0

  # § LIGHT — product-docs. Modular: no forward references, no assumed reading;
  # prerequisites are LINKED. description, tags, related become frontmatter.
  - unit: unit-01
    title: ""                   # task-phrased: "Rotate an API key"
    gate_critical: false
    type: how-to                # Diátaxis: tutorial | how-to | reference | explanation (docs-3)
    description: ""             # ONE sentence, <= 160 chars
    user_goal: ""
    prerequisites: []           # links to other articles
    structure:
      - heading: ""
        covers: ""
    tags: []                    # from the finite tag list defined in the outline
    related: []
    target_words: 0

  # ==========================================================================
  # § PAPER — scientific-paper
  # Reading-order `unit`; the pipeline walks ascending writing_order_rank:
  # Methods → Results → Introduction → Discussion → Abstract (highest rank).
  # ==========================================================================
  - unit: unit-01
    name: ""                    # Abstract | Introduction | Methods | Results | ...
    gate_critical: false
    writing_order_rank: 0
    claims: []                  # ids from bible/claims-map.yaml
    key_moves: []
    figures_tables:
      - ref: ""                 # "Figure 2"
        supports_claim: ""
    evidence_needed: ""
    checklist: ""               # Methods: reproducibility; Discussion: Limitations (mandatory)
    target_words: 0

  # § gate_critical (every shape): a unit carrying load-bearing content — the
  # claims the book rests on, the most-read article, a paper's Methods and
  # Results. Drives `pipeline.adversarial_verify.mode: gate_critical`. Mark few.
