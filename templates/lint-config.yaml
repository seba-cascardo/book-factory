# bible/lint-config.yaml — configuration for scripts/lint_style.py
#
# Optional. With no config the script still runs: spelling variants and
# whitespace rules need nothing, and the casing watchlist is derived from
# multi-word terms in `bible/glossary.md`. A pin here is checked on every unit
# forever — a better home than a line in the style guide someone must remember.
#
# Language-aware: English projects get the spelling-variant tables and the
# em-dash rule; other languages get neither (in Spanish the raya is dialogue
# punctuation with its own orthography), and Spanish 4-digit numbers take no
# thousands separator (RAE).

language_variant: ""        # empty = meta.yaml → project.language_variant (then
                            # conventions.language_variant, project.language, en-US)

dash_style: ""              # default: meta.yaml → conventions.dash_style.
                            # "em-dash, no spaces" flags ` — `; "spaced" flags `a—b`;
                            # empty = no em-dash rule. English only.

# ── Pinned terminology — a violation is an objective error ───────────────
pins: []
  # - pattern: "\\basset panel\\b"      # regex, case-sensitive as written
  #   prefer: "assets panel"
  #   why: "style pin"

# ── Forbidden terms — sugar for a pin, matched with word boundaries ──────
forbidden: []
  # - term: "junction table"
  #   prefer: "link table / bridge table"

# ── Casing watchlist ─────────────────────────────────────────────────────
# Multi-word terms whose capitalization must stay stable. Only the MINORITY
# variant is reported, and an even split (>40% of the majority) is left alone.
# Empty = derive from bible/glossary.md.
casing_watch: []
  # - set analysis

# ── Exemptions — lines matching any of these are skipped. Keep them narrow. ─
allow: []
  # - "^> quoted from the vendor docs"

sentence_case_headings: true   # default: conventions.heading_case == sentence.
                               # Flags 3+ capitalized words in a row (English).
thousands_separator: true      # flag unseparated numbers (4+ digits in English,
                               # 5+ in Spanish); years and line/page refs excluded.
