# drafts/unit-NN/scorecard.yaml — the Critic's machine-readable truth
#
# The verdict is COMPUTED from these rows per references/rubric.md § Verdict
# computation — the only place that rule lives. critique.md renders this file;
# this file carries the authority.
#
# Rows come from references/rubric.md (rhet) plus ONE family file, after the
# profile's § Rubric deltas and the voice profile's rhetoric_budget fence:
#   nonfiction (references/rubric-nonfiction.md): scope · outline · tech_a ·
#     tech_b · pedagogy · voice · reader_pov (full) · code · consistency ·
#     forward_refs · rhet · profile (+ paper-* / corp-* / docs-* / modular-*)
#   literary (references/rubric-literary.md): beats · character · arc · ending ·
#     voice · craft · format · reader_pov · continuity · rhet (rhet-2 only)
# One row per applicable item; not_applicable rows carry a one-line reason.

schema_version: "3.0"
unit: "unit-NN"
family: "nonfiction"             # nonfiction | literary
tolerance: "fast"                # fast | full (nonfiction full mode and literary: full)
cycle: 1
generated_at: "YYYY-MM-DDTHH:MM:SSZ"
checks: "drafts/unit-NN/checks.json"   # the script counts the counted rows copy

# ─────────────────────────────────────────────────────────────────────────
# items — EXACTLY these seven fields per row:
#   id · rubric · name · severity (critical | significant | minor)
#   status (pass | fail | not_applicable)
#   evidence — fails: quote / file:line / one-sentence diagnosis. Counted rows
#              ALWAYS carry the number copied from checks.json, pass or fail;
#              a counted row without it is invalid. Never a recount.
#   loopback_target — fails only: Writer | Editor | Humanizer | escalate;
#                     null on pass / not_applicable.
# ─────────────────────────────────────────────────────────────────────────
items:
  - id: scope-1
    rubric: scope
    name: "Unit delivers the outline entry's purpose"
    severity: critical
    status: pass
    evidence: null
    loopback_target: null

  - id: tech_a-4
    rubric: tech_a
    name: "No invented identifiers"
    severity: significant
    status: fail
    evidence: "checks.json identifiers.unknown=1: GroupSum() at humanized.md:212 (in code); not verified in tech-review.md"
    loopback_target: Writer

  - id: rhet-1
    rubric: rhet
    name: "Rhetorical questions within quota"
    severity: significant
    status: pass
    evidence: "checks.json counts.rhet-1: count=1 / quota 2 (L84)"
    loopback_target: null

  - id: rhet-6
    rubric: rhet
    name: "Opening structure differs from the previous unit's"
    severity: significant
    status: pass
    evidence: "this=field-case (declared and actual); prev=counterintuitive-data"
    # Always record both, so the next unit has its reference. First unit:
    # "this=<structure>; prev=none (first unit)".
    loopback_target: null

  - id: voice-8
    rubric: voice
    name: "Humanizer within its budget"
    severity: significant
    status: not_applicable
    evidence: "no pipeline.humanizer_budget; touched_ratio=0.18 (checks.json role_diff.humanizer)"
    loopback_target: null

  - id: reader_pov-1
    rubric: reader_pov
    name: "No comprehension failure from reader-report survives"
    severity: critical
    status: not_applicable
    evidence: "fast mode — Reader-POV did not run per unit"
    loopback_target: null

  # … every applicable row, in the family order of the family file.

# ─────────────────────────────────────────────────────────────────────────
# Computed from `items` per references/rubric.md. If this cache and the rows
# disagree, the rows are the truth — fix the rows, never the verdict.
# ─────────────────────────────────────────────────────────────────────────
computed_verdict: "REVISE"       # PASS | REVISE | REWORK | ESCALATE
verdict_basis: ">=1 significant fail (tech_a-4) → REVISE"
loopback_target: Writer          # null on PASS
most_important_problem: "tech_a-4: GroupSum() in the §3 example does not exist in the pinned release."

totals:
  critical:    { pass: 1, fail: 0, na: 1 }
  significant: { pass: 2, fail: 1, na: 1 }
  minor:       { pass: 0, fail: 0, na: 0 }
