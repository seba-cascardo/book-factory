# bible/fixed-defects.yaml — defects that were fixed and must not come back (MG-7)
#
# The negative counterpart of bible/do-not-touch.md: that file protects text that
# is CORRECT, this one forbids formulations that were WRONG.
# `scripts/check_fixed_defects.py` scans the whole book in every gate sweep; a
# reappearance defaults to `critical`. Why: docs/rationale/gate.md#mg7.
#
# PIN THE CLAIM, NOT THE CODE. The text that corrects a defect usually quotes the
# defective form to teach against it, so a literal pin on the expression fires on
# the fix itself, every round. Pin the conceptual frame, which only reappears if
# somebody reintroduced the wrong model. `allow_in` is the escape hatch for claim
# and counter-example that genuinely share wording, not a substitute for pinning well.
#
# LIFECYCLE. Born when a critical/major finding is resolved: the gate's report
# proposes the entry, the human writes and accepts it. Never expires: retire an
# entry explicitly, with a reason, like a waiver.

defects:
  - id: FIX-01
    what: >
      the chapter collapsed the three positions of the set modifier in Aggr() into
      two slots, so the middle position was described as equivalent to the outer one
    severity_if_back: critical    # critical | major | minor
    fixed_on: 2026-08-01
    detected_by: [concept-audit, polish-pass, rule-auditor, reader-pov]
    forbid:                       # kind: regex (default) | literal; case_sensitive: false
      - kind: regex
        pattern: '\btwo[- ]slots?\b'
      - kind: regex
        pattern: "outer aggregation's reach"
    scope: [ch-11, ch-18]         # unit stems or paths; empty = the whole book (prefer it:
                                  # a defect fixed in two chapters can return in a third)
    allow_in:
      - anchor: "That is the one that looks like the fix and is not"
        why: the corrected passage quotes the wrong form to teach against it; the
          anchor is matched against the hit's paragraph and its two neighbours

