  - 'invisibl\w*'
  - 'quietly'
  - 'without (?:complaint|warning)'
  - 'hidden (?:danger|cost|failure|trap)s?'
  - 'lurk\w*'
  - 'time bomb'
  - 'ticking'
  - 'insidious(?:ly)?'

# not_x_but_y (rhet-2) — reframe shapes, per the rubric.
not_x_but_y:
  # "It's not X, it's Y." / "This isn't X. It's Y."
  - '(?:it|this|that)(?:''s| is| was) not (?:just |only |simply |merely )?[^.;!?\n]{1,80}?[.,;:—–]\s*(?:it|this|that)(?:''s| is| was)\b'
  - '(?:it|this|that) (?:isn''t|wasn''t) (?:just |only |simply |merely )?[^.;!?\n]{1,80}?[.,;:—–]\s*(?:it|this|that)(?:''s| is| was)\b'
  # sentence-initial "Not X but Y" / "Not X. Y"
  - '(?:^|(?<=[.!?]\s))not (?:just |only |because )?[^.;!?\n]{1,60}?,?\s+but\b'
  - '(?:^|(?<=[.!?]\s))not (?:a|an|the|just|because|only)\b[^.!?\n]{0,50}\.\s+(?:a|an|the|it|this|just)\b'
  # "isn't just X; it's Y" / "not only X but also Y"
  - '(?:isn''t|is not|wasn''t|was not) (?:just|only|merely|simply) [^.!?\n]{1,80}?[;,—–]\s*(?:it''s|it is|it was)\b'
  - 'not (?:only|just|merely) [^.;!?\n]{1,60}?,? but(?: also)?\b'
  # "less about X than (about) Y"
  - 'less about [^.;!?\n]{1,60}? than(?: about)?\b'

