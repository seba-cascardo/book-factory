# Language pack — English. Loaded by scripts/bookkit/lexicon.py.
# Keys are shared across packs; a key missing here means "no list for this
# language", which the scripts report instead of printing a clean zero.
# Projects extend a pack with bible/lexicon.yaml (lists append, scalars replace,
# mappings merge).
#
# Convention: every list entry is a Python regex fragment, matched
# case-insensitively and word-bounded. Plain words are valid fragments. Plain-word
# lists (no regex): `stopwords`, `name_exclusions`, `non_person_names`,
# `institution_heads`, `name_connectors`, `locative_prepositions`,
# `indefinite_articles`, `object_markers`, `common_words`.
language: en

# ── Rule extraction (MG-2): patterns, not words. ─────────────────────────────
modality:        # strong prescriptive modality — a rule PRESCRIBES
  - 'must(?:\s+not)?'
  - 'never'
  - 'always'
  - 'cannot'
  - 'can''t'
  - 'do not'
  - 'don''t'
  - 'should(?:\s+not)?'
  - 'only ever'
  - 'only when'
  - 'only if'
  - 'has to'
  - 'have to'
  - 'required to'
  - 'forbidden'
  - 'avoid'
  - 'is not allowed'
  - 'will not work'
  - 'won''t work'
  - 'no exceptions'
universal:       # quantifier half of a descriptive prohibition
  - 'any'
  - 'every'
  - 'all'
  - 'no'
  - 'none of'
  - 'nothing'
  - 'each'
breaks:          # consequence half of a descriptive prohibition
  - 'breaks?'
  - 'disables?'
  - 'defeats?'
  - 'prevents?'
  - 'invalidates?'
  - 'forces?'
  - 'kills?'
  - 'silently (?:drops?|ignores?|fails?)'
  - 'falls? back'
  - 'degrades?'
  - 'discards?'
  - 'loses?'
  - 'voids?'
  - 'blocks?'
  - 'refuses?'

# ── Plain-word lists ─────────────────────────────────────────────────────────
# stopwords — function words plus common sentence openers of dialogue. Used to
# filter n-grams and to keep sentence-initial common words out of the new-name
# detector.
