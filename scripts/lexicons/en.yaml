  a, an, the, of, in, "on", at, to, for, with, by, from, as, into, onto, out, up,
  down, over, under, about, against, between, through, during, before, after,
  above, below, "off", near, since, until, upon, within, without, across, behind,
  and, or, but, nor, so, yet, if, then, than, because, though, although, while,
  when, where, whether, once, unless,
  i, "i'm", "i've", "i'd", "i'll", me, my, mine, myself, you, your, yours, he,
  him, his, she, her, hers, it, its, we, us, our, they, them, their, theirs,
  this, that, these, those, who, whom, whose, which, what, how, why,
  is, are, was, were, be, been, being, am, do, does, did, done, have, has, had,
  having, can, could, may, might, must, will, would, shall, should,
  "not", "no", "yes", nothing, something, anything, everything, all, any, both,
  each, few, more, most, other, some, such, only, own, same, very, just, also,
  again, further, here, there, now, today, tomorrow, yesterday, still, even,
  ever, never, always, maybe, perhaps, already, soon, later, outside, inside,
