  - 'whisper\w*'
  - 'shout\w*'
  - 'scream\w*'
  - 'cr(?:y|ied|ies)'
  - 'walk\w*'
  - 'walked'
  - 'enter\w*'
  - 'left'
  - 'arriv\w*'
  - 'sat'
  - 'stood'
  - 'looked'
  - 'stared'
  - 'glanced'
  - 'hugg?\w*'
  - 'kiss\w*'
  - 'smok\w*'
  - 'grabb?\w*'
  - 'waited'
  - 'thought'
  - 'decided'
  - 'trembl\w*'
  - 'brought'
  - 'opened'
  - 'closed'
  - 'picked'
  - 'answered'
  - 'repl(?:y|ied|ies)'
  - 'did(?:n.t)? (?:not )?(?:answer|say|look|move|smile|wave|speak)'
  - 'wav\w*'

