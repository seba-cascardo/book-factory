# initial_verb_forms — regex, full-token match. A token that only ever opens a
# sentence and matches one of these is a verb or adverb form, not a name.
# Endings shared with frequent names (-ly Emily/Holly/Beverly, -ing Irving,
# -fred/-dred/-mmed) are excluded.
# Card-opening words shaped like nouns are events, not people ("Call with
# Mary."). Used only for the FIRST word of an outline card field.
noun_suffixes: [tion, sion, ment, ness, ity, ance, ence, ship, ism, ure]

initial_verb_forms:
  - '(?![^\W\d_]*(?:fred|dred|mmed|hmed|eed)$)[^\W\d_]{4,}ed'
  - '[^\W\d_]{3,}(?:ally|fully)'
  - '[^\W\d_]{4,}ily'
  - '(?![^\W\d_]*(?:lly|erly|ily)$)[^\W\d_]{4,}ly'

# person_actions — verbs only a person does (see es.yaml).
