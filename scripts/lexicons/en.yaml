  - 'sneer(?:ed|s)'
  - 'bellow(?:ed|s)'
  - 'roar(?:ed|s)'
  - 'grumbl(?:ed|es)'
  - 'mus(?:ed)'
  - 'opin(?:ed)'
  - 'interject(?:ed|s)'
  - 'admonish(?:ed|es)'

gestures:
