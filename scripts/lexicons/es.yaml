  - 'exclam(?:[óo]|a|aba|aron)'

# gestures — label: pattern. The body-tic families of Spanish LLM fiction,
# with conjugation variants (present/past, 1st and 3rd person, pronominal
# forms). lint_fiction counts per family, per 1000 words, and across units.
gestures:
  reír: '(?:se|me|nos|te) (?:r[ií]en?|r[ií]o|ri[óo]|rieron|re[ií]an?|re[ií]mos|re[ií]s|re[ií])'
  sonreír: 'sonr[ií]en?|sonr[ií]o|sonri[óo]|sonrieron|sonre[ií]an?|sonre[ií]'
  asentir: 'asient(?:e|en)|asinti(?:[óo]|eron)|asent[ií]an?|asent[ií]|asiento con la cabeza'
  negar con la cabeza: '(?:niega|niegan|niego|neg[óo]|negaron|negaba|negaban|negu[ée]) con la cabeza'
  suspirar: 'suspir(?:a|an|[óo]|aron|aba|aban|[ée])|(?:solt[óoé]|suelta|larg[óoué]|larga|dej[óo] escapar) un suspiro'
  tragar saliva: '(?:traga|tragan|trago|trag[óo]|tragaron|tragaba|tragu[ée]) saliva'
  encogerse de hombros: '(?:se|me|nos|te) enco(?:ge|gen|jo|gi[óo]|gieron|g[ií]a|g[ií]an|g[ií]) de hombros'
  alzar una ceja: '(?:arque|levant|alz)(?:a|an|o|[óo]|aron|aba|aban|[ée]) (?:una|la|las) cejas?|alc[ée] (?:una|la) ceja'
  apretar la mandíbula: '(?:apriet(?:a|an|o)|apret(?:[óo]|aron|aba|aban|[ée])) (?:la mand[ií]bula|las mand[ií]bulas|los dientes|los pu[ñn]os|los labios)'
  morderse el labio: '(?:se|me|te) (?:muerden?|muerdo|mordi[óo]|mordieron|mord[ií]an?|mord[ií]) (?:el labio|los labios|la lengua)'
  fruncir el ceño: '(?:frunce|fruncen|frunzo|frunci[óo]|frunciendo|fruncieron|frunc[ií]a|frunc[ií]) el ce[ñn]o'
  mano por el pelo: '(?:se|me|te) pas(?:a|an|o|[óo]|aron|aba|[ée]) (?:la|una|las) manos? por (?:el pelo|el cabello|la cara|la nuca|la frente)'
  ojos en blanco: '(?:pone|ponen|pongo|puso|pusieron|pon[ií]a|puse) los ojos en blanco|revole(?:a|[óo]|aba) los ojos'
  cruzarse de brazos: '(?:se|me|te) cruz(?:a|an|o|[óo]|aron|aba|[ée]) de brazos'
  carraspear: 'carraspe(?:a|an|o|[óo]|aron|aba|[ée])'
  respirar hondo: 'respir(?:a|an|o|[óo]|aron|aba|[ée]) (?:hondo|profundo|profundamente)'
  desviar la mirada: 'desv(?:[ií]an?|[ií]o|i[óo]|iaron|iaba|i[ée]) la (?:mirada|vista)|baj(?:a|[óo]|aba|[ée]) la (?:mirada|vista)'
  cerrar los ojos: '(?:cierra|cierran|cierro|cerr[óo]|cerraron|cerraba|cerr[ée]) los ojos'
  hacer una mueca: '(?:hace|hacen|hago|hizo|hicieron|hac[ií]a|hice) una mueca'
  rascarse: '(?:se|me|te) rasc(?:a|an|o|[óo]|aron|aba) la (?:cabeza|nuca|barba)'

# cliches — stock phrases of Spanish prose (human and model alike).
cliches:
  - 'un nudo en (?:la garganta|el est[óo]mago)'
  - '(?:el|su|mi) coraz[óo]n (?:le |me )?(?:dio un vuelco|dio un salto|lat[ií]a con fuerza|se aceler[óo])'
  - 'se le hel[óo] la sangre'
  - 'la sangre se le hel[óo]'
  - 'como alma que lleva el diablo'
  - 'blanc[oa] como (?:la leche|el papel|la nieve)'
  - 'silencio sepulcral'
  - 'en un abrir y cerrar de ojos'
  - 'mariposas en el est[óo]mago'
  - '(?:sus|los) ojos se (?:llenaron|nublaron|empa[ñn]aron) de l[áa]grimas'
  - 'la calma (?:que precede a|antes de) la tormenta'
  - 'la gota que colm[óo] el vaso'
  - 'con el coraz[óo]n en la mano'
  - 'se pod[ií]a cortar con (?:un )?cuchillo'
  - 'un manojo de nervios'
  - 'un sudor fr[ií]o'
  - 'la piel de gallina'
  - 'como si (?:le|me) hubieran dado una bofetada'
  - 'el tiempo se detuvo'
  - 'a la velocidad de la luz'
  - 'contra viento y marea'

# attribute_terms — physical attributes checked for consistency per character.
# Each entry carries a named group `value`. Hair = colour (length and texture
# change legitimately).
attribute_terms:
  eyes:
    - 'ojos\s+(?:de\s+color\s+|color\s+)?(?P<value>negros|marrones|casta[ñn]os|verdes|azules|grises|celestes|miel|pardos|negras)'
  hair:
    - '(?:pelo|cabello|melena|cabellera)\s+(?:(?:muy|bien|medio)\s+)?(?P<value>rubi[oa]|casta[ñn][oa]|moroch[oa]|negr[oa]|pelirroj[oa]|colorad[oa]|canos[oa]|gris|blanc[oa]|te[ñn]id[oa])'
  age:
    - '(?:tiene|ten[ií]a|tengo|ten[eé]s|cumpli[óo]|cumple|cumpl[ií]a|de|con|a los|hab[ií]a cumplido)\s+(?P<value>\d{1,3}|[a-záéíóúñ]+(?:\s+y\s+[a-záéíóúñ]+)?)\s+a[ñn]os'
