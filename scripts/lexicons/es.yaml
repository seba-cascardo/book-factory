# not_x_but_y (rhet-2) — reframe shapes. Applied to one paragraph of narration
# at a time (dialogue excluded in fiction). Plain mid-sentence contrasts ("no
# quiero agua, sino vino") are deliberately not matched.
not_x_but_y:
  # "No es X, es Y." / "No era X. Era Y." / "No es X, no es Y. Es Z."
  - 'no (?:es|era|fue|ser[áa]|son|eran|fueron|est[áa]|estaba)(?: (?:solo|s[óo]lo|solamente|simplemente|[úu]nicamente|tan solo))? [^.;!?\n]{1,90}?[.,;:—–]\s*(?:es|era|fue|ser[áa]|son|eran|fueron|est[áa]|estaba)\b'
  # "no solo X, sino (también) Y"
  - 'no (?:s[óo]lo|solamente|[úu]nicamente|tan solo) [^.;!?\n]{1,90}?\bsino(?: que| tambi[ée]n)?'
  # "No se trata de X, sino de Y" / "No se trata de X. Se trata de Y."
  - 'no se trata(?:ba)? de [^.;!?\n]{1,90}?(?:[.,;:—–]\s*)(?:se trata(?:ba)? de|sino)'
  # "No porque X, sino porque Y"
  - 'no porque [^.;!?\n]{1,90}?\bsino porque'
  # "menos X que Y" as a reframe: "es menos una cuestión de X que de Y"
  - '(?:es|era|se trata|tiene que ver) menos (?:de |con |una cuesti[óo]n de )?[^.;!?\n]{1,60}? que (?:de |con )'
  - 'tiene menos que ver con [^.;!?\n]{1,60}? que con'
  # "Más que un X, era un Y."
  - 'm[áa]s que (?:un|una|el|la) [^.;!?\n]{1,50}?[,;:—–]\s*(?:es|era|fue)\b'

