# speech_verbs_ornate — tags that tell the reader how to feel. The raya is
# Spanish dialogue, so "said/asked only" does not translate; the ornate
# register does, and it is where Spanish LLM dialogue gives itself away.
speech_verbs_ornate:
  - 'espet(?:[óo]|a|an|aba|aron)'
  - 'mascull(?:[óo]|a|an|aba|aron)'
  - 'sise(?:[óo]|a|an|aba|aron)'
  - 'ronrone(?:[óo]|a|an|aba|aron)'
  - 'bram(?:[óo]|a|an|aba|aron)'
