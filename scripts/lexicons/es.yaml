# tease_closings (rhet-4) — forward teases in the last two paragraphs.
tease_closings:
  - 'ya (?:lo )?veremos'
  - '(?:ya )?(?:vas|van) a ver'
  - 'lo veremos (?:m[áa]s adelante|en el pr[óo]ximo cap[ií]tulo|pronto)'
