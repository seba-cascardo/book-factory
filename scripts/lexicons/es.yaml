# Language pack — Spanish (es-AR, es-ES, ...). Loaded by scripts/bookkit/lexicon.py.
# Keys are shared across packs; a key missing here means "no list for this
# language", which the scripts report instead of printing a clean zero.
# Projects extend a pack with bible/lexicon.yaml (lists append, scalars replace,
# mappings merge).
#
# Convention: every list entry is a Python regex fragment, matched
# case-insensitively and word-bounded. Plain words are valid fragments. Plain-word
# lists (no regex): `stopwords`, `name_exclusions`, `non_person_names`,
# `institution_heads`, `name_connectors`, `locative_prepositions`,
# `indefinite_articles`, `object_markers`, `common_words`. Rioplatense (voseo) and
# neutral/peninsular forms are both listed wherever they differ.
language: es

# ── Rule extraction (MG-2): patterns, not words. ─────────────────────────────
# Voseo and tuteo/usted forms both appear in technical Spanish; list all three.
modality:
  - 'nunca'
  - 'siempre'
  - 'jam[aá]s'
  - '(?:no )?(?:se )?debe(?:s|n|r[ií]a(?:s|n)?)?'
  - 'deb[eé]s'
  - 'hay que'
  - 'no hay que'
  - 'tiene(?:s|n)? que'
  - 'ten[eé]s que'
  - 'es obligatorio'
  - 'es necesario'
  - 'est[aá] prohibido'
  - 'no se puede'
  - 'no (?:pod[eé]s|puede(?:s|n)?)'
  - 's[oó]lo (?:si|cuando)'
  - '[uú]nicamente (?:si|cuando)'
  - 'evit[aá]'
  - 'evite(?:n)?'
  - 'evitar'
  - 'no us(?:[aá]s|es|e|en)'
  - 'no funciona(?:r[aá])?'
  - 'sin excepci[oó]n'
universal:
  - 'cualquier(?:a)?'
  - 'tod[oa]s?'
  - 'ning[uú]n(?:a|o)?'
  - 'nada'
  - 'cada'
breaks:
  - 'romp(?:e|en|er)'
  - 'desactiva(?:n)?'
  - 'anula(?:n)?'
  - 'impide(?:n)?'
  - 'invalida(?:n)?'
  - 'fuerza(?:n)?'
  - 'mata(?:n)?'
  - 'ignora(?:n)? en silencio'
  - 'falla(?:n)? en silencio'
  - 'descarta(?:n)?'
  - 'pierde(?:n)?'
  - 'bloquea(?:n)?'
  - 'degrada(?:n)?'
  - 'vuelve(?:n)? a'

