# institution_heads — common nouns that head a place or institution name. A
# capitalized word right after one ("Banco Nación", "Bar Roma", "Plaza San
# Martín", "Cooperativa de Aguas", "calle Sarmiento") is a place, not a person.
institution_heads: [
  banco, plaza, calle, avenida, av, bulevar, bv, pasaje, ruta, autopista, club,
  bar, café, confitería, restaurante, parrilla, hotel, hospital, sanatorio,
  clínica, escuela, colegio, universidad, facultad, instituto, liceo, parque,
  barrio, estación, terminal, aeropuerto, mercado, supermercado, shopping,
  teatro, museo, iglesia, catedral, parroquia, capilla, cine, cooperativa,
  ministerio, municipalidad, municipio, diario, revista, radio, canal, editorial,
  librería, galería, puerto, río, lago, laguna, monte, cerro, isla, playa,
  empresa, compañía, agencia, fábrica, imprenta, kiosco, almacén, edificio, torre,
  cementerio, estadio, cancha, avenida,
]
# name_connectors — words that may sit inside a multiword place name
# ("Cooperativa de Aguas", "Plaza de la Paz").
name_connectors: [de, del, la, el, los, las]
# locative_prepositions — a name that only ever follows these ("en Treviso",
# "hasta Mitre") is more likely a place: reported with low confidence.
locative_prepositions: [en, desde, hasta, hacia, rumbo]
# indefinite_articles — "una Coca", "un Fernet": products, low confidence.
indefinite_articles: [un, una, unos, unas]
# object_markers — prepositions that make the next name an object, not the
# subject of what follows ("a Gustavo lo miraron").
object_markers: [a, al, de, del, con, para, por, sin, sobre, entre, contra, hacia, desde, hasta, en,
  según, tras, ante, bajo]
# determiners — a sentence-initial word right before one of these is read as a
# verb, not a name ("Firmo un papel."); a name rarely takes a determiner next.
determiners: [el, un, una, unos, unas, mi, mis, tu, tus, su, sus, al, del, este, esta, estos,
  estas, ese, esa, esos, esas, aquel, aquella, aquellos, aquellas, nuestro, nuestra,
  nuestros, nuestras, cada]

