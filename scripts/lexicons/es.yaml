# initial_verb_forms — regex, full-token match, case-insensitive. A token that
# only ever opens a sentence and matches one of these is a verb form, not a name
# ("Rezó un Padre Nuestro.", "Llegaron tarde."). Endings shared with frequent
# names (-ía María, -ías Matías, -ando Fernando, -elo Marcelo, -ar/-er Javier)
# are deliberately absent: those verb forms belong in common_words instead.
# Card-opening words shaped like nouns are events, not people ("Llamada con
# Mariana."). Used only for the FIRST word of an outline card field; a person is
# still caught mid-sentence and on the page. Keep surname endings out (-ez, -ón).
noun_suffixes: [ción, sión, dad, tad, miento, aje, ismo, anza, encia, ancia, eza, ada, ura, ería]

initial_verb_forms:
  - '[^\W\d_]{2,}ó'
  - '[^\W\d_]{2,}(?:aba|abas|aban|ábamos)'
  - '[^\W\d_]{2,}(?:ían|íamos)'
  - '[^\W\d_]{3,}(?:aron|ieron)'
  - '[^\W\d_]{2,}(?:iendo|yendo)'
  - '[^\W\d_]{2,}(?:ándo|iéndo|yéndo)(?:se|le|les|lo|la|los|las|me|te|nos)'
  - '[^\W\d_]{2,}mente'
  - '[^\W\d_]{2,}(?:aste|iste|asteis|isteis)'
  - '[^\W\d_]{2,}(?:arse|erse|irse|arlo|erlo|irlo|arla|erla|irla|arle|erle|irle|arlos|arlas|arles)'
  - '[^\W\d_]{3,}(?:ale|ame|ate|ile|ime)'
  - '[^\W\d_]{3,}(?:rá|rán|rás|ría|rían|ríamos)'
  - '[^\W\d_]{3,}(?:amos|emos|imos)'
  - '[^\W\d_]{2,}[áéí](?:se|me|te|nos)(?:lo|la|los|las)'

# inverted_subject_verbs — intransitive verbs whose subject may FOLLOW them
# ("Entró Gustavo.", "esperaba Gustavo en la vereda"): the capitalized word right
# after one is in an actor position. Transitive verbs stay out: "Dejó Rosario"
# is a place left behind (a person object takes "a": "Dejó a Gustavo").
inverted_subject_verbs:
  - 'entr(?:[óo]|aba|aban|aron)'
  - 'sal(?:i[óo]|[ií]a|[ií]an|ieron)'
  - 'lleg(?:[óo]|aba|aban|aron)'
  - 'volvi(?:[óo]|eron)'
  - 'volv[ií]a(?:n)?'
  - 'camin(?:[óo]|aba|aban|aron)'
  - 'sonri(?:[óo]|eron)'
  - 'sonre[ií]a(?:n)?'
  - 'llor(?:[óo]|aba|aban|aron)'
  - 'suspir(?:[óo]|aba|aron)'
  - 'tembl(?:[óo]|aba|aron)'
  - 'asinti(?:[óo]|eron)'
  - 'esper(?:[óo]|aba|aban|aron)'
  - 'apareci(?:[óo]|eron)'
  - 'aparec[ií]a(?:n)?'
  - 'habl(?:[óo]|aba|aban|aron)'

