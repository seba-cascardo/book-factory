# name_exclusions — words that are capitalized without being people. Days and
# months (lowercase in correct Spanish, capitalized often enough), honorifics
# that precede a name, and the few capitalized common nouns of Spanish prose.
# Places, brands, teams and real people belong in bible/world.md instead.
