  - 'pero eso es (?:otra historia|harina de otro costal)'
  - 'no sab[ií]a(?:n)? (?:lo que|que) (?:le|les) esperaba'
  - 'poco sab[ií]a(?:n)?'
  - 'lo peor (?:todav[ií]a )?estaba por venir'
  - 'todav[ií]a no lo sab[ií]a(?:n)?'
  - 'pero eso (?:ser[áa]|es) para otro d[ií]a'

# ── Fiction (lint_fiction) ───────────────────────────────────────────────────
