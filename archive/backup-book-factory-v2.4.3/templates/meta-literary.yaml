# bible/meta.yaml — literary project metadata
#
# The pipeline reads this constantly. Every agent's context starts here.
# Keep it short, concrete, and up to date.

project:
  type: "literary"
  title: "[working title]"
  subtitle: null
  working_title: true

genre:
  primary: "[literary fiction | thriller | romance | sci-fi | fantasy | ...]"
  subgenre: "[specific lane]"
  comps: []                 # comparable published titles (for positioning)
  influences: []            # authors/works whose voice informs the project

target_reader:
  # The persona every agent simulates. The Reader-POV leans on this.
  description: "[one paragraph — who they are, what they read, what they
                 want from this book, what they're tired of in this genre]"
  age_range: "[e.g., 25–45]"
  sensibility: "[literary | commercial | crossover]"
  content_tolerance:
    violence: "none | implied | on-page"
    sex: "none | implied | on-page"
    language: "clean | salty | unrestricted"

voice:
  pov: "first | close_third | omniscient | multiple"
  tense: "past | present"
  register: "[one line — e.g., 'dry, observational, uses concrete sensory
              anchors, avoids lyricism']"
  calibration_passages:
    # 1–3 short passages in the style guide that exemplify the target voice.
    - "see bible/style-guide.md § Calibration"
  language_variant: "en-US"   # en-US, en-GB, es-AR, es-ES, etc.

scope:
  length_target_words: 80000    # full manuscript
  chapter_count_target: 24
  chapter_length_target_words: 3500
  chapter_length_min: 1500
  chapter_length_max: 5500
  pov_characters: []           # list character names whose POV appears

conventions:
  heading_case: "sentence"
  oxford_comma: true
  dash_style: "em-dash with no spaces"
  quote_style: "double_curly"
  scene_break_marker: "***"
  chapter_number_style: "word | digit | roman"

pipeline:
  # Literary pipeline runs "full" by default — for narrative fiction, voice
  # and emotional landing are load-bearing, so H